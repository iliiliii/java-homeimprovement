<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工排期 - 智享家 Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .phase-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        .phase-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: #eee;
        }

        .phase-card.done::before {
            background: var(--glass-success);
        }

        .phase-card.active::before {
            background: var(--glass-accent);
        }

        .sub-task {
            display: flex;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-bg);
            font-size: 14px;
            color: var(--glass-text-muted);
        }

        .icon-check {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            color: var(--glass-success);
        }

        .icon-circle {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            color: #ddd;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <div class="page-title">全案排期</div>
        <div style="width: 24px;"></div>
    </div>

    <div style="padding: 0 24px;">
        <div class="phase-card done">
            <div class="flex-between">
                <h3 style="font-size: 18px;">拆除阶段</h3>
                <span style="color: var(--glass-success); font-size: 12px; font-weight: 600;">已完成</span>
            </div>
            <div style="font-size: 12px; color: var(--glass-text-muted); margin-top: 4px;">11.01 - 11.10 (提前2天)</div>
        </div>

        <div class="phase-card active">
            <div class="flex-between">
                <h3 style="font-size: 18px;">水电阶段</h3>
                <span style="color: var(--glass-accent); font-size: 12px; font-weight: 600;">进行中</span>
            </div>
            <div style="font-size: 12px; color: var(--glass-text-muted); margin-top: 4px;">11.11 - 11.25 (延期1天)</div>

            <div class="sub-task">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-check" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                开槽布管
            </div>
            <div class="sub-task">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-check" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                强弱电箱安装
            </div>
            <div class="sub-task" style="color: var(--glass-text-main);">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon-circle" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                </svg>
                水管打压测试
            </div>

            <div
                style="margin-top: 16px; text-align: center; color: var(--glass-accent); font-size: 12px; font-weight: 600;">
                查看详情 >
            </div>
        </div>

        <div class="phase-card">
            <div class="flex-between">
                <h3 style="font-size: 18px; color: var(--glass-text-muted);">泥木阶段</h3>
                <span style="color: var(--glass-text-muted); font-size: 12px; font-weight: 600;">待开始</span>
            </div>
            <div style="font-size: 12px; color: var(--glass-text-muted); margin-top: 4px;">预计 11.26 开始</div>
        </div>
    </div>
</body>

</html>
