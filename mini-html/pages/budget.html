<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预算详情 - 智享家 Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .budget-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-card);
            text-align: center;
        }

        .category-row {
            display: flex;
            align-items: center;
            padding: 16px;
            background: white;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }

        .cat-icon {
            width: 40px;
            height: 40px;
            background: var(--glass-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            color: var(--glass-text-main);
        }

        .progress-bar {
            height: 6px;
            background: var(--glass-bg);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--glass-accent);
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <div class="page-title">预算详情</div>
        <div style="width: 24px;"></div>
    </div>

    <div style="padding: 0 24px;">
        <div class="budget-card">
            <div style="font-size: 14px; color: var(--glass-text-muted); margin-bottom: 8px;">总预算 (元)</div>
            <div style="font-size: 36px; font-weight: 700; color: var(--glass-text-main);">500,000</div>
            <div style="margin-top: 24px; display: flex; gap: 4px; height: 12px; border-radius: 6px; overflow: hidden;">
                <div style="width: 30%; background: #FF6B6B;"></div> <!-- Design -->
                <div style="width: 40%; background: #4ECDC4;"></div> <!-- Hard -->
                <div style="width: 20%; background: #45B7D1;"></div> <!-- Soft -->
                <div style="width: 10%; background: var(--glass-bg);"></div> <!-- Remaining -->
            </div>
            <div
                style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--glass-text-muted);">
                <span>已用: 45w</span>
                <span>剩余: 5w</span>
            </div>
        </div>

        <div class="section-title">费用明细</div>

        <div class="category-row">
            <div class="cat-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <div style="flex: 1;">
                <div class="flex-between">
                    <span style="font-weight: 600;">设计费</span>
                    <span>¥ 20,000</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 100%; background: #FF6B6B;"></div>
                </div>
            </div>
        </div>

        <div class="category-row">
            <div class="cat-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 21h18M5 21V7l8-4 8 4v14M8 21v-4h8v4"></path>
                </svg>
            </div>
            <div style="flex: 1;">
                <div class="flex-between">
                    <span style="font-weight: 600;">硬装施工</span>
                    <span>¥ 180,000</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 60%; background: #4ECDC4;"></div>
                </div>
            </div>
        </div>

        <div class="category-row">
            <div class="cat-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <div style="flex: 1;">
                <div class="flex-between">
                    <span style="font-weight: 600;">全屋定制</span>
                    <span>¥ 150,000</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 30%; background: #45B7D1;"></div>
                </div>
            </div>
        </div>

        <div class="category-row">
            <div class="cat-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <div style="flex: 1;">
                <div class="flex-between">
                    <span style="font-weight: 600;">软装家电</span>
                    <span>¥ 150,000</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 10%; background: #96CEB4;"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
