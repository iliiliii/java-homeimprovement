<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物料清单 - 智享家 Pro</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .category-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .tab-item {
            white-space: nowrap;
            padding: 8px 16px;
            border-radius: 100px;
            background: white;
            color: var(--glass-text-muted);
            font-size: 14px;
        }

        .tab-item.active {
            background: var(--glass-accent);
            color: white;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 16px;
            box-shadow: var(--shadow-card);
        }

        .product-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #eee;
        }

        .icon-check {
            width: 16px;
            height: 16px;
            color: white;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--glass-text-muted);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox.checked {
            background: var(--glass-accent);
            border-color: var(--glass-accent);
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="dashboard.html" style="text-decoration: none; color: inherit; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <div class="page-title">物料清单</div>
        <div style="width: 24px;"></div>
    </div>

    <div style="padding: 0 24px;">
        <div class="category-tabs">
            <div class="tab-item active">全部</div>
            <div class="tab-item">主材</div>
            <div class="tab-item">家具</div>
            <div class="tab-item">家电</div>
            <div class="tab-item">软装</div>
        </div>

        <div class="product-card">
            <div style="display: flex; align-items: center;">
                <div class="checkbox checked">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-check" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>
            <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
                class="product-img">
            <div style="flex: 1;">
                <div class="flex-between" style="margin-bottom: 4px;">
                    <div style="font-weight: 600;">科勒 智能马桶</div>
                    <span style="font-size: 12px; color: var(--glass-warning);">待采购</span>
                </div>
                <div style="font-size: 12px; color: var(--glass-text-muted); margin-bottom: 8px;">K-77795T-0</div>
                <div class="flex-between">
                    <span style="color: var(--glass-accent); font-weight: 600;">¥ 4,599</span>
                    <span style="font-size: 12px; color: var(--glass-text-muted);">需 11.30 前到位</span>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div style="display: flex; align-items: center;">
                <div class="checkbox"></div>
            </div>
            <img src="https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80"
                class="product-img">
            <div style="flex: 1;">
                <div class="flex-between" style="margin-bottom: 4px;">
                    <div style="font-weight: 600;">大自然 实木地板</div>
                    <span style="font-size: 12px; color: var(--glass-success);">已采购</span>
                </div>
                <div style="font-size: 12px; color: var(--glass-text-muted); margin-bottom: 8px;">橡木原色 910*125</div>
                <div class="flex-between">
                    <span style="color: var(--glass-accent); font-weight: 600;">¥ 12,000</span>
                    <span style="font-size: 12px; color: var(--glass-text-muted);">已入库</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
